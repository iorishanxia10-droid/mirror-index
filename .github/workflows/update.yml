name: update-and-deploy

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 6:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ponytail: 取得失敗時は前回データのまま公開する。失敗が続くならActionsのログを見る
      - name: Update data
        if: github.event_name != 'push'
        run: |
          node scripts/build-gift-data.mjs || git checkout data.js
          node scripts/build-support-data.mjs || git checkout support-data.js
          if ! (node test-data.js && node test-support.js); then git checkout data.js support-data.js; fi
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js support-data.js
          git diff --cached --quiet || git commit -m "Update data $(date +%F)" && git push
      - run: node scripts/sync-public.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/tool
      - id: deployment
        uses: actions/deploy-pages@v4
